name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" anyio uvicorn
      - run: pytest -q
      - run: ddcheck demo --out /tmp/demo
        continue-on-error: true  # exits 2 because the recorded workspace isn't ready for handoff
