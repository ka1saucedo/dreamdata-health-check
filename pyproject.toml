[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddcheck"
version = "0.1.0"
description = "Onboarding health checks for Dreamdata workspaces, built on the Dreamdata MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kai Saucedo" }]
dependencies = ["mcp>=1.12,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ddcheck = "ddcheck.cli:main"

[tool.setuptools]
packages = ["ddcheck"]

[tool.setuptools.package-data]
ddcheck = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
